<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apres-match</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{--bg:rgba(5,9,19,.94);--line:rgba(255,255,255,.12);--text:rgba(255,255,255,.96);--soft:rgba(255,255,255,.70);--gold:#ffd166;--green:#2ee59d;--shadow:0 28px 90px rgba(0,0,0,.48);--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font)}body{color:var(--text)}.scene{position:fixed;inset:0;display:grid;place-items:center;padding:44px;opacity:0;transform:scale(.985);pointer-events:none;transition:opacity .45s ease,transform .45s ease}.scene.show{opacity:1;transform:scale(1)}.card{width:min(1500px,94vw);min-height:min(790px,88vh);display:grid;grid-template-columns:420px 1fr;gap:34px;padding:34px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(circle at 14% 12%,rgba(20,115,255,.36),transparent 34%),radial-gradient(circle at 86% 16%,rgba(255,45,120,.28),transparent 32%),linear-gradient(180deg,rgba(7,13,29,.96),var(--bg));box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;position:relative}.card::before{content:"";position:absolute;inset:-2px;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.16) 42%,transparent 58%);transform:translateX(-105%);animation:shine 4.8s ease-in-out infinite;pointer-events:none}@keyframes shine{0%,45%{transform:translateX(-105%)}72%,100%{transform:translateX(105%)}}.winnerPanel{position:relative;min-width:0;display:flex;flex-direction:column;gap:18px;z-index:1}.eyebrow{font-size:18px;font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.title{font-size:48px;line-height:.95;font-weight:1000;letter-spacing:.02em;text-transform:uppercase}.winnerName{font-size:42px;line-height:1;font-weight:1000;text-transform:uppercase;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.18)}.winnerClub{font-size:20px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}.photoBox{flex:1;min-height:360px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));overflow:hidden;display:grid;place-items:center;position:relative}.photoBox img{width:100%;height:100%;object-fit:cover;display:none}.photoBox.hasPhoto img{display:block}.photoFallback{padding:34px;text-align:center;color:var(--soft);font-size:20px;font-weight:900;line-height:1.35}.photoBox.hasPhoto .photoFallback{display:none}.mainPanel{position:relative;z-index:1;min-width:0;display:grid;grid-template-rows:auto auto 1fr;gap:22px}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px}.player{min-width:0;padding:18px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}.player.right{text-align:right}.playerName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:26px;font-weight:1000;text-transform:uppercase}.playerClub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px;font-size:15px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}.setsScore{min-width:168px;text-align:center;font-size:58px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;color:#fff}.setsLabel{margin-top:8px;font-size:15px;color:var(--soft);font-weight:900;letter-spacing:.16em;text-transform:uppercase}.setGrid{display:flex;flex-wrap:wrap;gap:12px}.setChip{min-width:116px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.10);text-align:center}.setChip.win{border-color:rgba(46,229,157,.42);background:rgba(46,229,157,.12)}.setLabel{color:var(--soft);font-size:13px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}.setScore{margin-top:8px;font-size:30px;font-weight:1000;font-variant-numeric:tabular-nums}.statsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}.stat{min-height:126px;padding:18px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;justify-content:space-between}.statLabel{font-size:14px;font-weight:950;color:var(--soft);letter-spacing:.12em;text-transform:uppercase}.statValue{margin-top:12px;font-size:40px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums}.statNote{margin-top:8px;font-size:14px;color:var(--soft);font-weight:800}.waiting{position:fixed;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.65);font-size:22px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:0}body.preview .waiting{opacity:1}body.preview .scene{opacity:0}@media(max-width:980px){.card{grid-template-columns:1fr;min-height:auto}.photoBox{min-height:240px}.statsGrid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body class="preview">
  <div class="waiting" id="waiting">En attente de fin de match</div>
  <section class="scene" id="scene"><div class="card"><aside class="winnerPanel"><div class="eyebrow">Victoire</div><div class="title">Apres-match</div><div><div class="winnerName" id="winnerName">JOUEUR</div><div class="winnerClub" id="winnerClub">CLUB</div></div><div class="photoBox" id="photoBox"><img id="winnerPhoto" alt="Photo du joueur" /><div class="photoFallback" id="photoFallback">Vainqueur sans photo</div></div></aside><main class="mainPanel"><div class="scoreline"><div class="player"><div class="playerName" id="nameA">JOUEUR A</div><div class="playerClub" id="clubA">CLUB A</div></div><div class="setsScore"><span id="setsA">0</span> - <span id="setsB">0</span><div class="setsLabel">sets</div></div><div class="player right"><div class="playerName" id="nameB">JOUEUR B</div><div class="playerClub" id="clubB">CLUB B</div></div></div><div class="setGrid" id="setGrid"></div><div class="statsGrid" id="statsGrid"></div></main></div></section>
<script>
const params=new URLSearchParams(location.search);const room=params.get("room")||"table1";const forceShow=params.get("show")==="1";const socket=io();const el=id=>document.getElementById(id);
function safeText(value,fallback=""){const text=String(value??fallback).trim();return text||fallback}function n(value){const number=Number(value||0);return Number.isFinite(number)?number:0}function percent(won,total){return total?Math.round((won/total)*100):0}function other(side){return side==="A"?"B":"A"}function setsToWin(state){return Math.ceil(n(state.bestOf||5)/2)}function matchWinner(state){const need=setsToWin(state);if(n(state.sets?.A)>=need)return"A";if(n(state.sets?.B)>=need)return"B";return null}
function getPhotoFor(state,winner){return params.get("photo")||params.get(`photo${winner}`)||safeText(state.playerPhotos?.[winner],"")}
function isSetPointBefore(entry,side){const score=entry.setScoreBefore||{A:0,B:0};const opp=other(side);return n(score[side])>=10&&n(score[side])-n(score[opp])>=1}function isMatchPointBefore(entry,side,setsNeeded){const setsBefore=entry.setsBefore||{A:0,B:0};return n(setsBefore[side])===setsNeeded-1&&isSetPointBefore(entry,side)}
function summarize(state){const log=Array.isArray(state.pointLog)?state.pointLog:[];const total={A:0,B:0},serveWon={A:0,B:0},serveAttempts={A:0,B:0},receiveWon={A:0,B:0},bestStreak={A:0,B:0},savedSet={A:0,B:0},savedMatch={A:0,B:0};let currentWinner=null,currentLength=0;const needed=setsToWin(state);for(const point of log){const winner=point.winner==="B"?"B":"A";const server=point.server==="B"?"B":"A";total[winner]+=1;serveAttempts[server]+=1;if(point.onServe)serveWon[winner]+=1;else receiveWon[winner]+=1;if(winner===currentWinner)currentLength+=1;else{currentWinner=winner;currentLength=1}bestStreak[winner]=Math.max(bestStreak[winner],currentLength);const loser=other(winner);if(isSetPointBefore(point,loser))savedSet[winner]+=1;if(isMatchPointBefore(point,loser,needed))savedMatch[winner]+=1}return{total,serveWon,serveAttempts,receiveWon,bestStreak,savedSet,savedMatch}}
function stat(label,value,note=""){return`<div class="stat"><div class="statLabel">${label}</div><div><div class="statValue">${value}</div><div class="statNote">${note}</div></div></div>`}function renderSets(state,winner){const sets=Array.isArray(state.setHistory)?state.setHistory:[];if(!sets.length)return"";return sets.map((set,index)=>{const scoreA=n(set.score?.A),scoreB=n(set.score?.B),winClass=set.winner===winner?" win":"";return`<div class="setChip${winClass}"><div class="setLabel">Set ${index+1}</div><div class="setScore">${scoreA}-${scoreB}</div></div>`}).join("")}
function render(state){const winner=matchWinner(state);if(!winner&&!forceShow){document.body.classList.add("preview");el("scene").classList.remove("show");return}const shownWinner=winner||(n(state.sets?.A)>=n(state.sets?.B)?"A":"B"),loser=other(shownWinner),playerA=safeText(state.players?.A,"JOUEUR A"),playerB=safeText(state.players?.B,"JOUEUR B"),clubA=safeText(state.clubs?.A,"CLUB A"),clubB=safeText(state.clubs?.B,"CLUB B"),stats=summarize(state),photo=getPhotoFor(state,shownWinner);el("nameA").textContent=playerA;el("nameB").textContent=playerB;el("clubA").textContent=clubA;el("clubB").textContent=clubB;el("setsA").textContent=n(state.sets?.A);el("setsB").textContent=n(state.sets?.B);el("winnerName").textContent=shownWinner==="A"?playerA:playerB;el("winnerClub").textContent=shownWinner==="A"?clubA:clubB;el("setGrid").innerHTML=renderSets(state,shownWinner)||`<div class="setChip"><div class="setLabel">Sets</div><div class="setScore">${n(state.sets?.A)}-${n(state.sets?.B)}</div></div>`;const totalPoints=stats.total.A+stats.total.B,winnerServePct=percent(stats.serveWon[shownWinner],stats.serveAttempts[shownWinner]),loserServePct=percent(stats.serveWon[loser],stats.serveAttempts[loser]),winnerReceivePct=percent(stats.receiveWon[shownWinner],stats.serveAttempts[loser]);el("statsGrid").innerHTML=[stat("Points gagnes",stats.total[shownWinner],`${totalPoints} points joues`),stat("Service",`${winnerServePct}%`,`${stats.serveWon[shownWinner]}/${stats.serveAttempts[shownWinner]} points`),stat("Relance",`${winnerReceivePct}%`,`${stats.receiveWon[shownWinner]}/${stats.serveAttempts[loser]} points`),stat("Plus longue serie",stats.bestStreak[shownWinner],"points consecutifs"),stat("Service adverse",`${loserServePct}%`,`adversaire: ${stats.serveWon[loser]}/${stats.serveAttempts[loser]}`),stat("Balles sauvees",n(stats.savedMatch[shownWinner])+n(stats.savedSet[shownWinner]),"set/match points")].join("");const photoBox=el("photoBox"),img=el("winnerPhoto"),fallback=el("photoFallback");if(photo){img.src=photo;photoBox.classList.add("hasPhoto")}else{img.removeAttribute("src");fallback.textContent="Vainqueur sans photo";photoBox.classList.remove("hasPhoto")}document.body.classList.remove("preview");requestAnimationFrame(()=>el("scene").classList.add("show"))}
socket.on("connect",()=>socket.emit("join",room));socket.on("state",render);
</script>
</body>

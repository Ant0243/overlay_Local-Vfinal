<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score équipe</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{
      --bg: rgba(9, 10, 14, 0.92);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.96);
      --soft: rgba(255,255,255,.72);
      --shadow: 0 18px 42px rgba(0,0,0,.36);
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:transparent;
      font-family:var(--font);
    }
    .wrap{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      width:min(980px, calc(100vw - 56px));
      color:var(--text);
      pointer-events:none;
      user-select:none;
    }
    .band{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
      padding:8px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(18,20,30,.96), rgba(9,10,14,.97));
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .team{
      min-width:0;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      align-items:center;
      gap:14px;
      padding:10px 16px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.045);
    }
    .team.right{
      grid-template-columns:auto minmax(0, 1fr);
      text-align:right;
    }
    .name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:18px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--soft);
    }
    .score{
      min-width:46px;
      text-align:center;
      font-size:36px;
      line-height:1;
      font-weight:950;
      font-variant-numeric:tabular-nums;
      color:#fff;
    }
    .divider{
      width:2px;
      height:46px;
      border-radius:999px;
      background:linear-gradient(180deg, transparent, rgba(255,255,255,.32), transparent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="band">
      <div class="team left">
        <div class="name" id="clubA">CLUB A</div>
        <div class="score" id="scoreA">0</div>
      </div>
      <div class="divider"></div>
      <div class="team right">
        <div class="score" id="scoreB">0</div>
        <div class="name" id="clubB">CLUB B</div>
      </div>
    </div>
  </div>

<script>
  const room = new URLSearchParams(location.search).get("room") || "table1";
  const socket = io();
  const el = (id) => document.getElementById(id);

  function safeText(value, fallback = "") {
    const text = String(value ?? fallback).trim();
    return text || fallback;
  }

  function safeInt(value) {
    const n = Number(value);
    return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
  }

  socket.emit("join", room);
  socket.on("state", (state) => {
    el("clubA").textContent = safeText(state?.clubs?.A, "CLUB A");
    el("clubB").textContent = safeText(state?.clubs?.B, "CLUB B");
    el("scoreA").textContent = safeInt(state?.teamScore?.A);
    el("scoreB").textContent = safeInt(state?.teamScore?.B);
  });
</script>
</body>
</html>

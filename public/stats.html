<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats Table 1</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --blue:#1148ff; --pink:#ff2b6f; --bg:#07152c; --muted:#aab4c8; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }
    body { display:flex; align-items:center; justify-content:center; }
    #card { width:88vw; max-width:1450px; padding:54px 58px 48px; border-radius:10px; background:rgba(4,18,42,.96); color:white; opacity:0; transform:scale(.96); transition:opacity .45s ease, transform .45s ease; box-shadow:0 24px 70px rgba(0,0,0,.45); }
    #card.show { opacity:1; transform:scale(1); }
    .title { font-size:46px; letter-spacing:10px; font-weight:900; margin-bottom:46px; text-align:center; }
    .heads { display:grid; grid-template-columns:1fr 120px 1fr; align-items:center; gap:24px; margin-bottom:26px; }
    .side.right { text-align:right; }
    .club { color:var(--muted); font-size:21px; letter-spacing:2px; font-weight:800; margin-bottom:10px; }
    .name { font-size:34px; font-weight:900; }
    .vs { text-align:center; color:var(--muted); font-size:23px; font-weight:900; }
    .row { display:grid; grid-template-columns:90px 1fr 90px; gap:24px; align-items:center; margin:27px 0; }
    .num { font-size:38px; font-weight:900; }
    .num.right { text-align:right; }
    .label { text-align:center; color:var(--muted); font-size:22px; letter-spacing:3px; font-weight:900; margin-bottom:12px; }
    .bar { height:22px; border-radius:20px; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; background:rgba(255,255,255,.13); }
    .b { height:100%; }
    .a { background:var(--blue); justify-self:end; }
    .bb { background:var(--pink); }
  </style>
</head>
<body>
  <div id="card">
    <div class="title">STATISTIQUES DU MATCH</div>
    <div class="heads">
      <div class="side"><div class="club" id="clubA">CLUB A</div><div class="name" id="nameA">JOUEUR A</div></div>
      <div class="vs">VS</div>
      <div class="side right"><div class="club" id="clubB">CLUB B</div><div class="name" id="nameB">JOUEUR B</div></div>
    </div>
    <div id="rows"></div>
  </div>
<script>
const room = new URLSearchParams(location.search).get("room") || "table1";
const socket = io();
socket.emit("join", room);
let previousTotal = 0;
let previousSetsPlayed = 0;
let hideTimer = null;
function n(v){ return Number(v || 0); }
function computeStats(state){
  const log = Array.isArray(state.pointLog) ? state.pointLog : [];
  const points = { A:0, B:0 }, serve = { A:0, B:0 }, receive = { A:0, B:0 }, bestStreak = { A:0, B:0 }, maxGap = { A:0, B:0 };
  let currentWinner = null, currentLen = 0;
  for (const p of log) {
    const w = p.winner === "B" ? "B" : "A";
    points[w]++;
    if (p.onServe) serve[w]++; else receive[w]++;
    if (w === currentWinner) currentLen++; else { currentWinner = w; currentLen = 1; }
    bestStreak[w] = Math.max(bestStreak[w], currentLen);
    const s = p.scoreAfter || {};
    const diff = n(s.A) - n(s.B);
    if (diff > maxGap.A) maxGap.A = diff;
    if (-diff > maxGap.B) maxGap.B = -diff;
  }
  return [["POINTS GAGNÉS", points.A, points.B], ["AU SERVICE", serve.A, serve.B], ["SUR RELANCE", receive.A, receive.B], ["PLUS LONGUE SÉRIE", bestStreak.A, bestStreak.B], ["PLUS GROS ÉCART", maxGap.A, maxGap.B]];
}
function row(label, a, b){
  const total = Math.max(1, a + b);
  const pctA = Math.max(0, Math.min(100, (a / total) * 100));
  const pctB = Math.max(0, Math.min(100, (b / total) * 100));
  return `<div class="row"><div class="num">${a}</div><div><div class="label">${label}</div><div class="bar"><div class="b a" style="width:${pctA*2}%"></div><div class="b bb" style="width:${pctB*2}%"></div></div></div><div class="num right">${b}</div></div>`;
}
function render(state){
  document.getElementById("clubA").textContent = state?.clubs?.A || "CLUB A";
  document.getElementById("clubB").textContent = state?.clubs?.B || "CLUB B";
  document.getElementById("nameA").textContent = state?.players?.A || "JOUEUR A";
  document.getElementById("nameB").textContent = state?.players?.B || "JOUEUR B";
  document.getElementById("rows").innerHTML = computeStats(state).map(r => row(r[0], r[1], r[2])).join("");
}
function showStats(state){
  render(state);
  const card = document.getElementById("card");
  card.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => card.classList.remove("show"), 10000);
}
socket.on("state", (state) => {
  const total = Array.isArray(state.pointLog) ? state.pointLog.length : 0;
  const setsPlayed = Array.isArray(state.setHistory) ? state.setHistory.length : 0;
  const triggeredBy12Points = total > 0 && total % 12 === 0 && total !== previousTotal;
  const triggeredBetweenSets = setsPlayed > previousSetsPlayed;
  if (triggeredBy12Points || triggeredBetweenSets) showStats(state);
  previousTotal = total;
  previousSetsPlayed = setsPlayed;
});
</script>
</body>
</html>
